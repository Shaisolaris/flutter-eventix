name: flutter_eventix
description: >-
  Eventix - an event discovery and ticketing app. Browse events by category,
  pick ticket tiers with a live price breakdown, and manage tickets with a
  QR-style pass for each one.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management. EventixRepository is injected through a Riverpod
  # Provider so the UI layer never talks to shared_preferences directly.
  flutter_riverpod: ^2.6.1

  # Local persistence for tickets, saved events, and settings (stored as JSON).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
